[project]
name = "desina"
version = "0.1.0"
description = "Desina prototype"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
desina = "desina:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
